<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">

  <defs>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#DC2626"/>
    </marker>
    <linearGradient id="skinV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBDDB9"/>
      <stop offset="0.45" stop-color="#F6CFA3"/>
      <stop offset="1" stop-color="#EDBE90"/>
    </linearGradient>
    <radialGradient id="chestHi" cx="0.5" cy="0.26" r="0.6">
      <stop offset="0" stop-color="#FFF4E2" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#FFF4E2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sideL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C68A55" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#C68A55" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sideR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#C68A55" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#C68A55" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="torsoClip">
      <path d="M 184,38 L 184,50 C 184,57 179,61 167,65 C 147,70 122,74 106,82 C 91,89 84,100 84,117 C 84,152 89,205 93,252 C 95,302 90,358 88,400 L 312,400 C 310,358 305,302 307,252 C 311,205 316,152 316,117 C 316,100 309,89 294,82 C 278,74 253,70 233,65 C 221,61 216,57 216,50 L 216,38 Z"/>
    </clipPath>
    <filter id="soft" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="blur1" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="480" fill="white"/>

  <!-- Title -->
  <text x="200" y="24" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="600" fill="#111827">Apical Four-Chamber View</text>

  <!-- Orientation labels -->
  <text x="22" y="58" font-family="system-ui,sans-serif" font-size="11" fill="#6B7280">Pt Right</text>
  <text x="354" y="58" font-family="system-ui,sans-serif" font-size="11" fill="#6B7280">Pt Left</text>

  <!-- Drop shadow -->
  <path d="M 184,38 L 184,50 C 184,57 179,61 167,65 C 147,70 122,74 106,82 C 91,89 84,100 84,117 C 84,152 89,205 93,252 C 95,302 90,358 88,400 L 312,400 C 310,358 305,302 307,252 C 311,205 316,152 316,117 C 316,100 309,89 294,82 C 278,74 253,70 233,65 C 221,61 216,57 216,50 L 216,38 Z"
        transform="translate(0,5)" fill="#CBD5E1" opacity="0.5" filter="url(#soft)"/>

  <!-- Torso (neck, trapezius, deltoids, trunk) -->
  <path d="M 184,38 L 184,50 C 184,57 179,61 167,65 C 147,70 122,74 106,82 C 91,89 84,100 84,117 C 84,152 89,205 93,252 C 95,302 90,358 88,400 L 312,400 C 310,358 305,302 307,252 C 311,205 316,152 316,117 C 316,100 309,89 294,82 C 278,74 253,70 233,65 C 221,61 216,57 216,50 L 216,38 Z"
        fill="url(#skinV)" stroke="#C99B69" stroke-width="2" stroke-linejoin="round"/>

  <!-- Skin shading and highlight -->
  <g clip-path="url(#torsoClip)">
    <path d="M 184,38 L 184,50 C 184,57 179,61 167,65 C 147,70 122,74 106,82 C 91,89 84,100 84,117 C 84,152 89,205 93,252 C 95,302 90,358 88,400 L 312,400 C 310,358 305,302 307,252 C 311,205 316,152 316,117 C 316,100 309,89 294,82 C 278,74 253,70 233,65 C 221,61 216,57 216,50 L 216,38 Z"
          fill="url(#chestHi)"/>
    <rect x="76" y="36" width="72" height="366" fill="url(#sideL)"/>
    <rect x="252" y="36" width="72" height="366" fill="url(#sideR)"/>
  </g>

  <!-- Deltoid / axillary grooves -->
  <path d="M 107,84 C 98,100 97,118 103,134" fill="none" stroke="#CE9A66" stroke-width="1.5" opacity="0.5"/>
  <path d="M 293,84 C 302,100 303,118 297,134" fill="none" stroke="#CE9A66" stroke-width="1.5" opacity="0.5"/>

  <!-- Suprasternal notch -->
  <ellipse cx="200" cy="64" rx="6.5" ry="4" fill="#C8935F" opacity="0.45" filter="url(#blur1)"/>

  <!-- Clavicles (ridge: highlight above, shadow below) -->
  <path d="M 193,62 Q 150,71 106,81" fill="none" stroke="#FFEBD2" stroke-width="1.6" opacity="0.9"/>
  <path d="M 193,66 Q 150,75 107,85" fill="none" stroke="#C28A5B" stroke-width="1.8" opacity="0.5"/>
  <path d="M 207,62 Q 250,71 294,81" fill="none" stroke="#FFEBD2" stroke-width="1.6" opacity="0.9"/>
  <path d="M 207,66 Q 250,75 293,85" fill="none" stroke="#C28A5B" stroke-width="1.8" opacity="0.5"/>

  <!-- Sternum (underlying landmark) -->
  <line x1="200" y1="66" x2="200" y2="240" stroke="#B98E5C" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>

  <!-- Ribs (underlying) — patient right (image left) -->
  <path d="M 198,90  Q 162,94  122,102" fill="none" stroke="#D9AE7A" stroke-width="1.1" stroke-dasharray="5,4" opacity="0.65"/>
  <path d="M 198,110 Q 160,115 118,125" fill="none" stroke="#D9AE7A" stroke-width="1.1" stroke-dasharray="5,4" opacity="0.65"/>
  <path d="M 198,130 Q 158,136 115,149" fill="none" stroke="#D9AE7A" stroke-width="1.1" stroke-dasharray="5,4" opacity="0.65"/>
  <path d="M 198,150 Q 156,157 112,172" fill="none" stroke="#D9AE7A" stroke-width="1.1" stroke-dasharray="5,4" opacity="0.65"/>
  <path d="M 198,170 Q 155,178 110,196" fill="none" stroke="#D9AE7A" stroke-width="1.1" stroke-dasharray="5,4" opacity="0.65"/>

  <!-- Ribs (underlying) — patient left (image right) -->
  <path d="M 202,90  Q 238,94  278,102" fill="none" stroke="#D9AE7A" stroke-width="1.1" stroke-dasharray="5,4" opacity="0.65"/>
  <path d="M 202,110 Q 240,115 282,125" fill="none" stroke="#D9AE7A" stroke-width="1.1" stroke-dasharray="5,4" opacity="0.65"/>
  <path d="M 202,130 Q 242,136 285,149" fill="none" stroke="#D9AE7A" stroke-width="1.1" stroke-dasharray="5,4" opacity="0.65"/>
  <path d="M 202,150 Q 244,157 288,172" fill="none" stroke="#D9AE7A" stroke-width="1.1" stroke-dasharray="5,4" opacity="0.65"/>
  <path d="M 202,170 Q 245,178 290,196" fill="none" stroke="#D9AE7A" stroke-width="1.1" stroke-dasharray="5,4" opacity="0.65"/>

  <!-- Pectoral contours -->
  <path d="M 197,162 C 170,168 130,160 109,136" fill="none" stroke="#CE9A66" stroke-width="1.8" opacity="0.55"/>
  <path d="M 203,162 C 230,168 270,160 291,136" fill="none" stroke="#CE9A66" stroke-width="1.8" opacity="0.55"/>

  <!-- Nipples (midclavicular line, ~4th ICS) -->
  <circle cx="138" cy="150" r="6" fill="#D1936B" opacity="0.55"/>
  <circle cx="138" cy="150" r="2.6" fill="#B97851" opacity="0.85"/>
  <circle cx="262" cy="150" r="6" fill="#D1936B" opacity="0.55"/>
  <circle cx="262" cy="150" r="2.6" fill="#B97851" opacity="0.85"/>

  <!-- ICS numbers -->
  <text x="86" y="94"  font-family="system-ui,sans-serif" font-size="10" fill="#4B5563" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke">2</text>
  <text x="84" y="114" font-family="system-ui,sans-serif" font-size="10" fill="#4B5563" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke">3</text>
  <text x="82" y="134" font-family="system-ui,sans-serif" font-size="10" fill="#4B5563" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke">4</text>
  <text x="80" y="154" font-family="system-ui,sans-serif" font-size="10" fill="#4B5563" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke">5</text>
  <text x="75" y="164" font-family="system-ui,sans-serif" font-size="9" fill="#4B5563" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke">ICS</text>

  <!-- Costal margin (ridge with soft shadow) -->
  <path d="M 200,240 Q 172,260 148,275" fill="none" stroke="#B47B49" stroke-width="4" opacity="0.3" filter="url(#blur1)"/>
  <path d="M 200,240 Q 228,260 252,275" fill="none" stroke="#B47B49" stroke-width="4" opacity="0.3" filter="url(#blur1)"/>
  <path d="M 200,240 Q 172,260 148,275" fill="none" stroke="#C9945F" stroke-width="1.8"/>
  <path d="M 200,240 Q 228,260 252,275" fill="none" stroke="#C9945F" stroke-width="1.8"/>

  <!-- Xiphoid -->
  <polygon points="200,240 194,252 206,252" fill="#B98E5C" opacity="0.5"/>

  <!-- Linea alba and umbilicus -->
  <line x1="200" y1="254" x2="200" y2="344" stroke="#CE9A66" stroke-width="1" opacity="0.45"/>
  <ellipse cx="200" cy="334" rx="3.2" ry="4.2" fill="#BE8557" opacity="0.6"/>

  <!-- Heart (subtle) — slightly larger here to show apex position -->
  <ellipse cx="248" cy="150" rx="52" ry="63" fill="#FEE2E2" opacity="0.25"/>

  <!-- Midclavicular line (patient's left = image right) -->
  <line x1="256" y1="62" x2="280" y2="320" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="3,4" opacity="0.5"/>
  <text x="268" y="58" font-family="system-ui,sans-serif" font-size="9" fill="#4B5563" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke" text-anchor="middle">MCL</text>

  <!-- PMI marker (5th ICS, midclavicular line, patient's left = image right) -->
  <!-- 5th ICS ≈ y=170; MCL (patient's L) ≈ x=268 -->
  <circle cx="268" cy="188" r="7" fill="none" stroke="#059669" stroke-width="2"/>
  <line x1="262" y1="188" x2="274" y2="188" stroke="#059669" stroke-width="1.5"/>
  <line x1="268" y1="182" x2="268" y2="194" stroke="#059669" stroke-width="1.5"/>
  <text x="284" y="186" font-family="system-ui,sans-serif" font-size="9" fill="#047857" font-weight="600" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke">PMI</text>
  <text x="284" y="197" font-family="system-ui,sans-serif" font-size="9" fill="#047857" font-weight="600" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke">5th ICS</text>

  <!-- PROBE — Apical: at PMI (image right, lower chest), indicator to patient's left (image right).
       rotate(90) CW → indicator from top moves to right in image. -->
  <g transform="translate(268,210) rotate(90)">
    <rect x="-9" y="-28" width="18" height="56" rx="5" fill="#1E3A5F"/>
    <circle cx="0" cy="-21" r="5.5" fill="#DC2626"/>
    <rect x="-9" y="22" width="18" height="7" rx="2" fill="#3B82F6"/>
  </g>

  <!-- After rotate(90) at (268,210): local(0,-21) → global(268+21, 210) = (289,210) -->
  <line x1="292" y1="210" x2="335" y2="210" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="340" y="214" font-family="system-ui,sans-serif" font-size="10" fill="#DC2626" font-weight="600" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke">Pt Left</text>

  <!-- Probe description -->
  <rect x="60" y="348" width="280" height="86" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="200" y="368" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#374151">Placement</text>
  <text x="200" y="386" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#374151">PMI — 5th ICS, midclavicular line</text>
  <text x="200" y="403" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#374151">Indicator → patient's left (3 o'clock)</text>
  <text x="200" y="420" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#4B5563">Left lateral decubitus improves image quality</text>
  <text x="200" y="430" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#4B5563">Palpate for PMI if displaced</text>

</svg>
