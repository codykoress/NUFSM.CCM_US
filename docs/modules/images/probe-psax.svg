<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">

  <defs>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#DC2626"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#1D4ED8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="400" height="480" fill="white"/>

  <!-- Title -->
  <text x="200" y="24" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="600" fill="#111827">Parasternal Short Axis (PSAX)</text>

  <!-- Orientation labels -->
  <text x="22" y="58" font-family="system-ui,sans-serif" font-size="10" fill="#9CA3AF">Pt Right</text>
  <text x="354" y="58" font-family="system-ui,sans-serif" font-size="10" fill="#9CA3AF">Pt Left</text>

  <!-- Neck -->
  <rect x="184" y="38" width="32" height="18" rx="8" fill="#FEF3E2" stroke="#D4A76A" stroke-width="1.5"/>

  <!-- Torso -->
  <path d="M 190,50 C 175,50 120,64 90,84 L 80,400 L 320,400 L 310,84 C 280,64 225,50 210,50 Z"
        fill="#FEF3E2" stroke="#D4A76A" stroke-width="2"/>

  <!-- Clavicles -->
  <path d="M 196,62 Q 152,72 104,84" fill="none" stroke="#D4A76A" stroke-width="1.5"/>
  <path d="M 204,62 Q 248,72 296,84" fill="none" stroke="#D4A76A" stroke-width="1.5"/>

  <!-- Sternum -->
  <line x1="200" y1="62" x2="200" y2="240" stroke="#C4A060" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.8"/>

  <!-- Ribs — patient right (image left) -->
  <path d="M 198,90  Q 162,94  122,102" fill="none" stroke="#E0B87A" stroke-width="1.2"/>
  <path d="M 198,110 Q 160,115 118,125" fill="none" stroke="#E0B87A" stroke-width="1.2"/>
  <path d="M 198,130 Q 158,136 115,149" fill="none" stroke="#E0B87A" stroke-width="1.2"/>
  <path d="M 198,150 Q 156,157 112,172" fill="none" stroke="#E0B87A" stroke-width="1.2"/>
  <path d="M 198,170 Q 155,178 110,196" fill="none" stroke="#E0B87A" stroke-width="1.2"/>

  <!-- Ribs — patient left (image right) -->
  <path d="M 202,90  Q 238,94  278,102" fill="none" stroke="#E0B87A" stroke-width="1.2"/>
  <path d="M 202,110 Q 240,115 282,125" fill="none" stroke="#E0B87A" stroke-width="1.2"/>
  <path d="M 202,130 Q 242,136 285,149" fill="none" stroke="#E0B87A" stroke-width="1.2"/>
  <path d="M 202,150 Q 244,157 288,172" fill="none" stroke="#E0B87A" stroke-width="1.2"/>
  <path d="M 202,170 Q 245,178 290,196" fill="none" stroke="#E0B87A" stroke-width="1.2"/>

  <!-- ICS numbers -->
  <text x="86" y="94"  font-family="system-ui,sans-serif" font-size="9" fill="#9CA3AF">2</text>
  <text x="84" y="114" font-family="system-ui,sans-serif" font-size="9" fill="#9CA3AF">3</text>
  <text x="82" y="134" font-family="system-ui,sans-serif" font-size="9" fill="#9CA3AF">4</text>
  <text x="80" y="154" font-family="system-ui,sans-serif" font-size="9" fill="#9CA3AF">5</text>
  <text x="75" y="164" font-family="system-ui,sans-serif" font-size="8" fill="#9CA3AF">ICS</text>

  <!-- Costal margin -->
  <path d="M 200,240 Q 172,260 148,275" fill="none" stroke="#D4A76A" stroke-width="1.5"/>
  <path d="M 200,240 Q 228,260 252,275" fill="none" stroke="#D4A76A" stroke-width="1.5"/>

  <!-- Xiphoid -->
  <polygon points="200,240 194,252 206,252" fill="#C4A060" opacity="0.5"/>

  <!-- Heart (subtle) -->
  <ellipse cx="245" cy="148" rx="50" ry="60" fill="#FEE2E2" opacity="0.25"/>

  <!-- Left shoulder label -->
  <text x="268" y="75" font-family="system-ui,sans-serif" font-size="9" fill="#9CA3AF">L shoulder</text>

  <!-- PLAX ghost probe (light, showing starting position) -->
  <g transform="translate(242,128) rotate(-45)" opacity="0.18">
    <rect x="-9" y="-28" width="18" height="56" rx="5" fill="#1E3A5F"/>
  </g>

  <!-- Rotation arrow showing 90° clockwise rotation from PLAX -->
  <path d="M 252,105 A 22,22 0 0,1 268,128" fill="none" stroke="#1D4ED8" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr-blue)"/>
  <text x="272" y="108" font-family="system-ui,sans-serif" font-size="9" fill="#1D4ED8">90° CW</text>

  <!-- PROBE — PSAX: same position as PLAX, rotated 90° clockwise from it.
       PLAX rotation was -45°. PSAX rotation = -45 + 90 = +45°.
       Indicator at top in local coords → after rotate(+45) points to upper-right in image. -->
  <g transform="translate(242,128) rotate(45)">
    <rect x="-9" y="-28" width="18" height="56" rx="5" fill="#1E3A5F"/>
    <circle cx="0" cy="-21" r="5.5" fill="#DC2626"/>
    <rect x="-9" y="22" width="18" height="7" rx="2" fill="#3B82F6"/>
  </g>

  <!-- Indicator annotation: after rotate(+45) at (242,128), local(0,-21) → global ~(257,113) -->
  <line x1="258" y1="111" x2="302" y2="76" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="306" y="72" font-family="system-ui,sans-serif" font-size="10" fill="#DC2626" font-weight="500">Indicator</text>
  <text x="306" y="84" font-family="system-ui,sans-serif" font-size="10" fill="#DC2626" font-weight="500">(Pt Left shoulder)</text>

  <!-- ICS label near probe -->
  <text x="270" y="148" font-family="system-ui,sans-serif" font-size="9" fill="#6B7280">3rd–4th ICS</text>

  <!-- Probe description -->
  <rect x="60" y="348" width="280" height="74" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="200" y="368" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#374151">Placement</text>
  <text x="200" y="386" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#374151">Same position as PLAX — rotate 90° clockwise</text>
  <text x="200" y="403" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#374151">Indicator → left shoulder (~1–2 o'clock)</text>
  <text x="200" y="416" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#6B7280">Fan toward base or apex to change level</text>

</svg>
