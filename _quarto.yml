project:
  type: website
  output-dir: docs
  render:
    # Only the real site pages — keeps internal working docs
    # (roadmap.md, clip-embed-worksheet.md, handoff-*.md) out of the build
    - index.qmd
    - about.qmd
    - credits.qmd
    - modules/*.qmd
  resources:
    - competency-dashboard.html
    - case-logbook.html

website:
  title: "POCUS for CCM Fellows"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - text: Modules
        menu:
          - href: modules/01-windows.qmd
            text: "1. Windows & Acquisition"
          - href: modules/02-lv.qmd
            text: "2. LV Function"
          - href: modules/03-rv.qmd
            text: "3. RV Function"
          - href: modules/04-pericardium.qmd
            text: "4. Pericardium"
          - href: modules/05-ivc.qmd
            text: "5. IVC & Volume"
          - href: modules/08-lung.qmd
            text: "6. Lung Ultrasound"
          - href: modules/09-abdominal.qmd
            text: "7. Abdominal"
          - href: modules/10-dvt.qmd
            text: "8. DVT"
          - href: modules/06-integration.qmd
            text: "9. Integration"
      - href: about.qmd
        text: About
      - href: credits.qmd
        text: Credits
    right:
      - href: case-logbook.html
        text: Case Logbook
      - href: competency-dashboard.html
        text: Competency Registry

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..900,0..100;1,9..144,300..900,0..100&family=Archivo:ital,wght@0,300..800;1,300..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
    include-after-body:
      - chatbot-widget.html
      - quiz-widget.html