<!-- POCUS Chatbot Widget — injected into every page via _quarto.yml include-after-body -->
<!-- After deploying cloudflare-worker/worker.js, replace YOUR_WORKER_URL_HERE below -->
<style>
  #pocus-chat-btn {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: #2780e3;
    color: #fff;
    border: none;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.22);
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, transform 0.15s;
  }
  #pocus-chat-btn:hover { background: #1a68c8; transform: scale(1.06); }

  #pocus-chat-panel {
    position: fixed;
    bottom: 86px;
    right: 24px;
    width: 360px;
    height: 460px;
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 8px 36px rgba(0,0,0,0.18);
    display: flex;
    flex-direction: column;
    z-index: 9998;
    overflow: hidden;
    transition: opacity 0.18s, transform 0.18s;
  }
  #pocus-chat-panel.pocus-hidden {
    opacity: 0;
    pointer-events: none;
    transform: translateY(12px);
  }

  .pocus-header {
    background: #2780e3;
    color: #fff;
    padding: 13px 16px;
    font-weight: 600;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .pocus-header-close {
    margin-left: auto;
    background: none;
    border: none;
    color: rgba(255,255,255,0.8);
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    padding: 0 2px;
  }
  .pocus-header-close:hover { color: #fff; }

  .pocus-messages {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    font-size: 13.5px;
    line-height: 1.5;
  }

  .pocus-msg {
    max-width: 88%;
    padding: 8px 12px;
    border-radius: 10px;
    word-break: break-word;
  }
  .pocus-msg.pocus-bot {
    background: #f0f4fb;
    align-self: flex-start;
    border-bottom-left-radius: 3px;
    color: #1a1a2e;
  }
  .pocus-msg.pocus-user {
    background: #2780e3;
    color: #fff;
    align-self: flex-end;
    border-bottom-right-radius: 3px;
  }
  .pocus-msg.pocus-bot a {
    color: #2780e3;
    font-weight: 500;
    text-decoration: underline;
  }

  .pocus-typing {
    display: flex;
    gap: 4px;
    align-items: center;
    padding: 10px 12px;
    background: #f0f4fb;
    border-radius: 10px;
    border-bottom-left-radius: 3px;
    align-self: flex-start;
    width: 52px;
  }
  .pocus-typing span {
    width: 6px;
    height: 6px;
    background: #9ca3af;
    border-radius: 50%;
    animation: pocus-bounce 1.1s infinite;
  }
  .pocus-typing span:nth-child(2) { animation-delay: 0.18s; }
  .pocus-typing span:nth-child(3) { animation-delay: 0.36s; }
  @keyframes pocus-bounce {
    0%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-5px); }
  }

  .pocus-input-row {
    display: flex;
    border-top: 1px solid #e5e7eb;
    padding: 10px;
    gap: 8px;
    flex-shrink: 0;
  }
  .pocus-input-row input {
    flex: 1;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    padding: 8px 11px;
    font-size: 13.5px;
    outline: none;
    font-family: inherit;
  }
  .pocus-input-row input:focus { border-color: #2780e3; }
  .pocus-input-row button {
    background: #2780e3;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 13px;
    cursor: pointer;
    font-size: 13.5px;
    font-family: inherit;
    white-space: nowrap;
  }
  .pocus-input-row button:disabled { background: #9ca3af; cursor: not-allowed; }

  @media (max-width: 480px) {
    #pocus-chat-panel { width: calc(100vw - 32px); right: 16px; bottom: 80px; }
    #pocus-chat-btn { right: 16px; bottom: 16px; }
  }
</style>

<button id="pocus-chat-btn" aria-label="Open POCUS assistant">
  <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
    <path d="M2 1a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h9.586a2 2 0 0 1 1.414.586l2 2V2a1 1 0 0 0-1-1z"/>
  </svg>
</button>

<div id="pocus-chat-panel" class="pocus-hidden" role="dialog" aria-label="POCUS Assistant">
  <div class="pocus-header">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
      <path d="M2 1a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h9.586a2 2 0 0 1 1.414.586l2 2V2a1 1 0 0 0-1-1z"/>
    </svg>
    POCUS Assistant
    <button class="pocus-header-close" id="pocus-close" aria-label="Close">&times;</button>
  </div>
  <div class="pocus-messages" id="pocus-messages">
    <div class="pocus-msg pocus-bot">Hi! Ask me any POCUS question and I'll point you to the right module.</div>
  </div>
  <div class="pocus-input-row">
    <input id="pocus-input" type="text" placeholder="e.g. How do I assess for tamponade?" autocomplete="off" />
    <button id="pocus-send">Send</button>
  </div>
</div>

<script>
(function () {
  // ── CONFIG ──────────────────────────────────────────────────────────────
  var WORKER_URL = 'https://ultrasoundguru.codykoress.workers.dev/';
  // ────────────────────────────────────────────────────────────────────────

  var MODULE_PATHS = {
    '01': 'modules/01-windows.html',
    '02': 'modules/02-lv.html',
    '03': 'modules/03-rv.html',
    '04': 'modules/04-pericardium.html',
    '05': 'modules/05-ivc.html',
    '06': 'modules/06-integration.html',
    '07': 'modules/07-valves.html',
    '08': 'modules/08-lung.html',
    '09': 'modules/09-abdominal.html',
    '10': 'modules/10-dvt.html',
    '11': 'modules/11-procedural.html',
  };

  // Derive site base URL from Quarto's site_libs path so links work on any host
  function getSiteBase() {
    var scripts = document.querySelectorAll('script[src]');
    for (var i = 0; i < scripts.length; i++) {
      if (scripts[i].src.indexOf('site_libs/') !== -1) {
        return scripts[i].src.split('site_libs/')[0].replace(/\/$/, '');
      }
    }
    return window.location.origin;
  }

  var BASE = getSiteBase();

  function escapeHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function renderBot(text) {
    var escaped = escapeHtml(text);
    // Convert [Label](MODULE:XX) to anchor tags
    var html = escaped.replace(
      /\[([^\]]+)\]\(MODULE:(\d{2})\)/g,
      function (_, label, num) {
        var path = MODULE_PATHS[num];
        if (!path) return label;
        return '<a href="' + BASE + '/' + path + '" target="_blank" rel="noopener">' + label + '</a>';
      }
    );
    // **bold**
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    // newlines
    html = html.replace(/\n/g, '<br>');
    return html;
  }

  var btn     = document.getElementById('pocus-chat-btn');
  var panel   = document.getElementById('pocus-chat-panel');
  var closeBtn= document.getElementById('pocus-close');
  var msgs    = document.getElementById('pocus-messages');
  var input   = document.getElementById('pocus-input');
  var sendBtn = document.getElementById('pocus-send');

  var history = [];

  function openPanel() {
    panel.classList.remove('pocus-hidden');
    input.focus();
  }
  function closePanel() {
    panel.classList.add('pocus-hidden');
  }

  btn.addEventListener('click', function () {
    panel.classList.contains('pocus-hidden') ? openPanel() : closePanel();
  });
  closeBtn.addEventListener('click', closePanel);

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !sendBtn.disabled) sendMessage();
  });
  sendBtn.addEventListener('click', sendMessage);

  function appendMsg(cls, html, isHTML) {
    var div = document.createElement('div');
    div.className = 'pocus-msg ' + cls;
    if (isHTML) div.innerHTML = html; else div.textContent = html;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
    return div;
  }

  function addTyping() {
    var div = document.createElement('div');
    div.className = 'pocus-typing';
    div.innerHTML = '<span></span><span></span><span></span>';
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
    return div;
  }

  async function sendMessage() {
    var text = input.value.trim();
    if (!text) return;

    input.value = '';
    sendBtn.disabled = true;

    appendMsg('pocus-user', text, false);
    history.push({ role: 'user', content: text });

    var typing = addTyping();

    try {
      var res = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history }),
      });

      if (!res.ok) throw new Error('HTTP ' + res.status);

      var data = await res.json();
      var reply = data.text
        ? data.text
        : "Sorry, I couldn't get a response. Please try again.";

      history.push({ role: 'assistant', content: reply });
      typing.remove();
      appendMsg('pocus-bot', renderBot(reply), true);
    } catch (err) {
      typing.remove();
      appendMsg('pocus-bot', 'Connection error. Make sure the chatbot worker is deployed and the URL is configured.', false);
    }

    sendBtn.disabled = false;
    input.focus();
  }
}());
</script>
